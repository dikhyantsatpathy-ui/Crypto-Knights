<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nocap — Provenance Ledger</title>
    <meta
      name="description"
      content="nocap is a cryptographic provenance ledger: institutions sign and anchor official media, the public verifies it in milliseconds."
    />
    <!-- Favicon: inline data-URI so the single-file build needs no extra assets. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23059669'/%3E%3Cpath d='M32 12l13 14v12c0 9-5.4 14-13 16-7.6-2-13-7-13-16V26z' fill='none' stroke='%23ffffff' stroke-width='3.5'/%3E%3Cpath d='M26 32l4 4 8-9' fill='none' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <!-- Google Identity Services (single sign-on for authorities). -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Apply the saved theme before first paint so there is no light-flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("nocap-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
