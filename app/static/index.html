<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nocap — Provenance Ledger</title>
    <meta
      name="description"
      content="nocap is a cryptographic provenance ledger: institutions sign and anchor official media, the public verifies it in milliseconds."
    />
    <!-- Favicon: inline data-URI so the single-file build needs no extra assets. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23059669'/%3E%3Cpath d='M32 12l13 14v12c0 9-5.4 14-13 16-7.6-2-13-7-13-16V26z' fill='none' stroke='%23ffffff' stroke-width='3.5'/%3E%3Cpath d='M26 32l4 4 8-9' fill='none' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"

    <!-- Google Identity Services (single sign-on for authorities). -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Apply the saved theme before first paint so there is no light-flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("nocap-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

nt, drop it here, and the app tells you if it's the genuine original, has been tampered with, was cancelled, or was never official at all. If you're unsure whether something is real, this is where you check."},authority:{t:"Authority — the officials' room",b:"A locked staff area. Officials sign in with a Google account, wait for an admin to approve their job title, then use it to sign files, post emergency notices, manage the records, and screen identity documents. Regular readers can't get in."},analytics:{t:"Analytics — the scoreboard",b:"Shows how many checks the system has run and what it found — real files, fakes, cancelled ones, unofficial ones — plus today's AI-detector usage. Only summary numbers, no personal details."},"sign out":{t:"Sign out",b:"Logs the official out and closes their secure session — like locking the desk drawer when you leave for lunch."},"verify health":{t:"Verify / run the check",b:"Press this after choosing a file. It acts like a security hologram check: the app compares the file's unique fingerprint (its SHA-256 digest) against the official record, checks the signature, and instantly tells you — genuine, tampered, cancelled, or never registered."},"verify another file":{t:"Verify another file",b:"Clears the current result so you can check a different file. Handy when you're going through a batch of suspicious messages."},"report this fake":{t:"Report this fake",b:"For a result that came back as a forgery: it logs that exact copy as a scam so others can see it circulated, and the network learns from it."},"trust this file":{t:"Trust this file",b:"A confirmation after a positive check: you ran the scan, the app says AUTHENTIC, so you can safely treat the file as the real thing."},"verify who signed this":{t:"Verify who signed this",b:"Reveals the person behind the signature — name, job title and organisation. These details are assigned by an admin, not typed by the signer, so nobody can make themselves look important."},"check with the ng key — and every file that key ever signed turns into REVOKED across the whole network, instantly. Old copies suddenly can't be trusted, which is exactly what you want if someone's keys were stolen."},reinstate:{t:"Reinstate",b:"The admin's undo button. Brings a revoked key back to life — but only with the original PIN, so one careless click can't un-retire a whole batch by accident."},"batch anchor":{t:"Batch anchor (L2 sync)",b:"Admin command: bundles all unsealed records into one tree, then stamps its summary onto the blockchain — the permanent public receipt book that nobody can quietly edit."},"inject demo attack":{t:"Inject demo attack",b:"A demo-only toy button. It plants fake 'caught a fake!' records so a judge can watch the fraud dashboard light up. The data is invented and harmless."},"rollback ledger":{t:"Rollback ledger",b:"An admin emergency drill: wipes every record newer than a chosen time. It deliberately works while staying visible on the blockchain, so it can't be abused in secret."},"screen document":{t:"Screen document",b:"For officials checking IDs like Aadhaar or a passport. Upload the photo or PDF, and the app reads the details, checks the numbers follow the official rules, and gives a clear score — CLEAR, REVIEW, or FLAGGED — with plain-English reasons for every point."},clear:{t:"Clear (supervisor's call)",b:"The supervisor says 'this document looks genuine'. The decision is recorded permanently — it becomes part of the official paper trail."},"confirm fraud":{t:"Confirm fraud",b:"The supervisor agrees the document is a fake. The evidence and reasoning stay attached to the report permanently."},inconclusive:{t:"Inconclusive",b:"The supervisor can't decide, so the case is handed to a human for a closer look — better than guessing."},"add to watchlist":{t:"Add to watchlist (admin only)",b:"Stores a hidden fingerprint of a known-bad number — never the number itself, for privacy. If that number ever shows up in a screening again, it instantly chor on top.",s:"README.md + app main"},{id:"how",tags:["how","works","flow","sign","verify","chain"],q:"How does the trust chain actually work?",a:"Three layers: **01 the digest** — every file becomes a SHA-256 fingerprint (the file itself is never stored); **02 the signature** — an approved institution binds its key to that digest, signed server-side in a vault; **03 the chain** — each signature is appended to the ledger, retractions only mark it revoked, and a Merkle root is anchored to the L2 chain as `NOCAP_ROOT:<root>`.",s:"Public page 'Three layers, one trust chain'"},{id:"verify",tags:["verify","check","verdict","auth","authentic","genuine","real"],q:"How do I verify a file?",a:"On the *Verify* tab: drop a file, a zip, or pasted text. The app re-derives the SHA-256, looks it up in the ledger, checks the authority's ECDSA signature, runs a forensic + AI scan, then shows the verdict card: `AUTHENTIC`, `PROVEN_FAKE`, `REVOKED`, or `UNSIGNED`, with who signed it and when.",s:"VerifyPanel + api.ts"},{id:"sign",tags:["sign","anchor","authority","official","publish","broadcast"],q:"How do officials sign and publish?",a:"In *Authority*: upload a file and press **Sign & anchor**. The server SHA-256s it, signs with your vault key (ECDSA), injects a forensic trap, writes a ledger block and pins a receipt. **Issue signed broadcast** does the same for emergency text and posts it to the public notice board.",s:"AuthorityView.tsx"},{id:"revoke",tags:["revoke","kill","switch","pin","cascade","stolen","compromised","cancel"],q:"What is the kill switch?",a:"`Set PIN` registers a 5-digit emergency code. `Revoke access` then **permanently retires a signing key — and every ledger block that key ever signed turns into REVOKED across the network** in one step. `Reinstate` (administrator, PIN required) is the only way back, so a mis-click can't undo a whole batch.",s:"AuthorityView + main.py kill-switch route"},{id:"screen",tags:["screen","screening","mha","document","id","aadhaar","voter","verify-document"],q:"What does the document screening desk do?",a:"Officers upload an identity photo/PDF (Aadhaar, passport, voter ID) plus declared fields. The pipeline **extracts fields, validates checksums (Verhoeff for Aadhaar, ICAO 9303 MRZ for passports), cross-checks the ledger and watchlist, and runs the AI detector** — returning CLEAR / REVIEW / FLAGGED with one explainable reason per risk point. Only masked identifiers are stored.",s:"MHA_SCREENING.md + screening.py"},{id:"watchlist",tags:["watchlist","blacklist","flagged","administrator","privacy","bloom"],q:"How does the watchlist work without storing raw numbers?",a:"Administrators add a *hashed* identifier + a reason phrase. Screening compares identifiers **before hashing**, so the raw Aadhaar/number never touches the database — zero plaintext storage. If a watchlisted number shows up again, it glows red as a risk.",s:"MHA_SCREENING.md watchlist section"},{id:"ai",tags:["ai","detector","sightengine","heuristic","onnx","deepfake","genai"],q:"What is the AI detector?",a:"The app checks images for AI generation with **interchangeable backends**: the free offline *heuristic* (metadata self-tags + pixel noise scan), the cloud *Sightengine* model, or a *self-hosted ONNX* vision classifier. Every path returns the same verdict shape and a plain-language explanation; a scanned document is detected first and routed past the photo-focused AI models.",s:"inlined AI-detection section of app/main.py"},{id:"ledger",tags:["ledger","blockchain","anchor","l2","merkle","root","sync","tamper"],q:"Where does the blockchain come in?",a:"Every signed file creates a ledger block (hash-chained, signed, timestamped). **Batch anchor (L2 sync)** folds all un-anchored blocks into one Merkle tree and broadcasts `NOCAP_ROOT:<root>` on-chain. The on-chain root is the audit-trail backstop: an offline rollback is possible but visibly breaks the chain — no silent abuse.",s:"main.py blockchain/sync route"},{id:"analytics",tags:["analytics","stats","metrics","counts","dashboard","fraud","public"],q:"What is on the Analytics page?",a:"Aggregate-only public metrics: verdict totals (authentic / fake / revoked / unsigned), screening area stats, fraud reports, and today's AI-detector usage (e.g. 470/500) — **counters only, no personal rows exposed**.",s:"AnalyticsView.tsx"},{id:"privacy",tags:["privacy","zero","storage","pii","hash","mask","sensitive","data"],q:"Is this privacy-safe / zero-storage?",a:"Yes by design: **files never leave your browser** on verify (only the digest is sent); the ledger stores hashes and *masked* identifiers, never raw content or naked numbers; receipt JSONs are how you keep your own copy. The footer literally reads `ZERO-STORAGE VERIFICATION`.",s:"VerifyPanel + screening mute/mask"},{id:"rollback",tags:["rollback","drill","disaster","recovery","reset","clean"],q:"What is the rollback ledger used for?",a:"An administrator disaster-recovery drill: pick a UTC boundary and every newer record is deleted. It is deliberate, needs the admin role, and because it happens under a watchful on-chain root it can't be used to secretly clean evidence.",s:"AuthorityView rollback modal"},{id:"roles",tags:["roles","access","officer","administrator","approve","authorisation","authz"],q:"Who can do what?",a:"Anyone can verify and read analytics. **Approved officers** (Google SSO + admin-assigned post/institution) can sign, broadcast, and screen documents. **Administrators** adjudicate screening verdicts, manage the watchlist, assign roles, and run ledger sync/rollback. Titles are granted, never self-claimed.",s:"main.py access model + MHA_SCREENING.md"},{id:"fake",tags:["fake","fake","forgery","fraud","report","scam","proven_fake"],q:"What happens when a file comes back fake?",a:"The card shows `PROVEN_FAKE` and offers **Report this fake** — logging that exact copy + hash as a community fraud report so the network learns it circulated. A tampered file keeps its signed history but is marked non-authentic.",s:"VerdictCard.tsx"},{id:"compare",tags:["compare","copy","versions","match","zip","batch"],q:"Can I compare two copies of a file?",a:"Yes — the **Compare a copy** control takes a second SHA-256 (or a second file) and instantly says match or mismatch. Great for spotting a subtly altered 'copy' of a real document. Zip batches verify each member individually.",s:"VerdictCard compare control"},{id:"tech",tags:["tech","stack","fastapi","react","vite","sqlite","vercel","provider"],q:"What is the tech stack?",a:"**Backend**: FastAPI + SQLAlchemy/SQLite + cryptography (ECDSA/KMS-style signer), Sightengine/web3 for anchoring, bundled in two files (`app/main.py`, `app/screening.py`). **Frontend**: React + TypeScript + Vite, built into a single self-contained `app/static/index.html`. Deployable on Vercel via `api/index.py`.",s:"requirements.txt + package.json"},{id:"run",tags:["run","start","install","setup","local","port","8000"],q:"How do I run it locally?",a:"Double-click **START.bat** (Windows): it installs Python + npm deps on first run, rebuilds the frontend, starts `uvicorn` on port 8000 and opens the browser. Manual: `python -m pip install -r requirements.txt`, `npm install && npm run build` in `frontend/`, then `uvicorn main:app --port 8000` from `app/`.",s:"START.bat + HOW_TO_HOST.md"},{id:"explain",tags:["explain","mode","breakdown","verdict","layman","details","why","reason","tooltip","help","guide"],q:"What is Explain Mode?",a:'**Explain mode** is an interactive educational switch located in the top navigation bar (`frontend/src/app/explain.tsx`). When toggled **ON**, the cursor changes to a help pointer and tapping any button, tab, or input control (e.g. Verify, Sign & Anchor, Revoke, Screening) opens a plain-English "what & why" card explaining that action instead of performing it. It is designed for non-technical users and judges to explore how each feature works safely. In addition, every file verification automatically includes a detailed forensic breakdown of the SHA-256 digest, AI generation checks, ECDSA signature, and identity checksums.',s:"frontend/src/app/explain.tsx + VerifyPanel.tsx"}],ap=["What does nocap do?","How does verify work?","What is Explain Mode?","What is the kill switch?","What is on the Analytics page?","What is the tech stack?","How do I run it locally?"],xo=f=>f.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();function op(f,y=2){const o=xo(f);if(!o)return[];const _=o.split(" ").filter(Boolean);return ip.map(l=>{const h=xo(l.tags.join(" ")),u=xo(l.q);let v=0;for(const S of _)h.includes(S)?v+=3:u.includes(S)&&(v+=1),(h.startsWith(S)||u.includes(S))&&(v+=1);return _.every(S=>h.includes(S)||u.includes(S))&&(v+=4),{e:l,score:v}}).filter(l=>l.score>0).sort((l,h)=>h.score-l.score).slice(0,y).map(l=>l.e)}function _o(f){const y=op(f,2);return y.length?y.map(o=>o.a+(o.s?`
