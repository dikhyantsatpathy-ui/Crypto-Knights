<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nocap — Provenance Ledger</title>
    <meta
      name="description"
      content="nocap is a cryptographic provenance ledger: institutions sign and anchor official media, the public verifies it in milliseconds."
    />
    <!-- Favicon: inline data-URI so the single-file build needs no extra assets. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23059669'/%3E%3Cpath d='M32 12l13 14v12c0 9-5.4 14-13 16-7.6-2-13-7-13-16V26z' fill='none' stroke='%23ffffff' stroke-width='3.5'/%3E%3Cpath d='M26 32l4 4 8-9' fill='none' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"

    <!-- Google Identity Services (single sign-on for authorities). -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Apply the saved theme before first paint so there is no light-flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("nocap-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

ste another fingerprint (or drop a second copy) and the app immediately says match or mismatch. Perfect for spotting a slightly different 'copy' of a real file."},"google single sign-in":{t:"Google sign-in",b:"The officials' unlock button. Sign in with Google, the server quietly creates a private signing key inside a locked vault, and gives you a session cookie. Your private key never leaves the server — you never see it, so nobody can steal it from you."},"sign & anchor":{t:"Sign & anchor",b:"The official's 'make it official' button. It stamps the file with an invisible mark, records a receipt in the public ledger, and locks a summary onto the blockchain. You get the signed file back to distribute."},"issue signed broadcast":{t:"Issue signed broadcast",b:"The official's 'announce it' button. Takes the text message, signs it, timestamps it, and puts it on the public bulletin board so everyone can verify it's really from that office."},"issue broadcast":{t:"Issue broadcast",b:"Publishes the draft message as a signed, timestamped emergency notice on the public board."},"assign role":{t:"Assign role (admin only)",b:"Admin-only: gives an official their job title and organisation. Whatever is typed here is what shows up on everything they sign. Officials can't write their own title, which stops impostors."},"set pin":{t:"Set PIN",b:"Sets a secret 5-digit code. If the official's account is ever hijacked, this PIN is the emergency kill switch to shut down their signing key."},"revoke access":{t:"Revoke (kill switch)",b:"The emergency stop button. Using the PIN, an official can permanently retire a signing key — and every file that key ever signed turns into REVOKED across the whole network, instantly. Old copies suddenly can't be trusted, which is exactly what you want if someone's keys were stolen."},reinstate:{t:"Reinstate",b:"The admin's undo button. Brings a revoked key back to life — but only with the original PIN, so one careless click can't un-retire a whole batch by accident."},"batch anchor":{t:"Batch anchor (L2 sync)",b:"Admin command: bundles all unsealed records into one tree, then stamps its summary onto the blockchain — the permanent public receipt book that nobody can quietly edit."},"inject demo attack":{t:"Inject demo attack",b:"A demo-only toy button. It plants fake 'caught a fake!' records so a judge can watch the fraud dashboard light up. The data is invented and harmless."},"rollback ledger":{t:"Rollback ledger",b:"An admin emergency drill: wipes every record newer than a chosen time. It deliberately works while staying visible on the blockchain, so it can't be abused in secret."},"screen document":{t:"Screen document",b:"For officials checking IDs like Aadhaar or a passport. Upload the photo or PDF, and the app reads the details, checks the numbers follow the official rules, and gives a clear score — CLEAR, REVIEW, or FLAGGED — with plain-English reasons for every point."},clear:{t:"Clear (supervisor's call)",b:"The supervisor says 'this document looks genuine'. The decision is recorded permanently — it becomes part of the official paper trail."},"confirm fraud":{t:"Confirm fraud",b:"The supervisor agrees the document is a fake. The evidence and reasoning stay attached to the report permanently."},inconclusive:{t:"Inconclusive",b:"The supervisor can't decide, so the case is handed to a human for a closer look — better than guessing."},"add to watchlist":{t:"Add to watchlist (admin only)",b:"Stores a hidden fingerprint of a known-bad number — never the number itself, for privacy. If that number ever shows up in a screening again, it instantly glows red as a risk."},remove:{t:"Remove",b:"Takes a number off the watchlist so it no longer raises flags in screening."},"check previous broadcasts":{t:"Check previous broadcasts",b:"Opens the full history of past official notices, each with an exact date and time, so you can scroll back further than today."},"view all":{t:"View all",b:"Shows every past official notice ins  retractions only mark it revoked, and a Merkle root is anchored to the L2 chain as `NOCAP_ROOT:<root>`.",s:"Public page 'Three layers, one trust chain'"},{id:"verify",tags:["verify","check","verdict","auth","authentic","genuine","real"],q:"How do I verify a file?",a:"On the *Verify* tab: drop a file, a zip, or pasted text. The app re-derives the SHA-256, looks it up in the ledger, checks the authority's ECDSA signature, runs a forensic + AI scan, then shows the verdict card: `AUTHENTIC`, `PROVEN_FAKE`, `REVOKED`, or `UNSIGNED`, with who signed it and when.",s:"VerifyPanel + api.ts"},{id:"sign",tags:["sign","anchor","authority","official","publish","broadcast"],q:"How do officials sign and publish?",a:"In *Authority*: upload a file and press **Sign & anchor**. The server SHA-256s it, signs with your vault key (ECDSA), injects a forensic trap, writes a ledger block and pins a receipt. **Issue signed broadcast** does the same for emergency text and posts it to the public notice board.",s:"AuthorityView.tsx"},{id:"revoke",tags:["revoke","kill","switch","pin","cascade","stolen","compromised","cancel"],q:"What is the kill switch?",a:"`Set PIN` registers a 5-digit emergency code. `Revoke access` then **permanently retires a signing key — and every ledger block that key ever signed turns into REVOKED across the network** in one step. `Reinstate` (super admin, PIN required) is the only way back, so a mis-click can't undo a whole batch.",s:"AuthorityView + main.py kill-switch route"},{id:"screen",tags:["screen","screening","mha","document","id","aadhaar","voter","verify-document"],q:"What does the document screening desk do?",a:"Officers upload an identity photo/PDF (Aadhaar, passport, voter ID) plus declared fields. The pipeline **extracts fields, validates checksums (Verhoeff for Aadhaar, ICAO 9303 MRZ for passports), cross-checks the ledger and watchlist, and runs the AI detector** — returning CLEAR / REVIEW / FLAGGED with one explainable reason per risk point. Only masked identifiers are stored.",s:"MHA_SCREENING.md + screening.py"},{id:"watchlist",tags:["watchlist","blacklist","flagged","super-admin","privacy","bloom"],q:"How does the watchlist work without storing raw numbers?",a:"Super admins add a *hashed* identifier + a reason phrase. Screening compares identifiers **before hashing**, so the raw Aadhaar/number never touches the database — zero plaintext storage. If a watchlisted number shows up again, it glows red as a risk.",s:"MHA_SCREENING.md watchlist section"},{id:"ai",tags:["ai","detector","sightengine","heuristic","onnx","deepfake","genai"],q:"What is the AI detector?",a:"The app checks images for AI generation with **interchangeable backends**: the free offline *heuristic* (metadata self-tags + pixel noise scan), the cloud *Sightengine* model, or a *self-hosted ONNX* vision classifier. Every path returns the same verdict shape and a plain-language explanation; a scanned document is detected first and routed past the photo-focused AI models.",s:"inlined AI-detection section of app/main.py"},{id:"ledger",tags:["ledger","blockchain","anchor","l2","merkle","root","sync","tamper"],q:"Where does the blockchain come in?",a:"Every signed file creates a ledger block (hash-chained, signed, timestamped). **Batch anchor (L2 sync)** folds all un-anchored blocks into one Merkle tree and broadcasts `NOCAP_ROOT:<root>` on-chain. The on-chain root is the audit-trail backstop: an offline rollback is possible but visibly breaks the chain — no silent abuse.",s:"main.py blockchain/sync route"},{id:"analytics",tags:["analytics","stats","telemetry","counts","dashboard","fraud","public"],q:"What is on the Analytics page?",a:"Aggregate-only public telemetry: verdict totals (authentic / fake / revoked / unsigned), screening area stats, fraud reports, and today's AI-detector usage (e.g. 470/500) — **counters only, no personal rows exposed**.",s:"AnalyticsView.tsx"},{id:"privacy",tags:["privacy","zero","storage","pii","hash","mask","sensitive","data"],q:"Is this privacy-safe / zero-storage?",a:"Yes by design: **files never leave your browser** on verify (only the digest is sent); the ledger stores hashes and *masked* identifiers, never raw content or naked numbers; receipt JSONs are how you keep your own copy. The footer literally reads `ZERO-STORAGE VERIFICATION`.",s:"VerifyPanel + screening mute/mask"},{id:"demo",tags:["demo","judge","present","presentation","show","dday","attack"],q:"How do we demo the fraud dashboard?",a:"A super admin can use **Inject demo attack (DDay)** — a toy button that plants fake MALICIOUS-ACTOR records and verdict logs so PROVEN_FAKE analytics light up in front of a judge. The data is invented and clearly separated from real records.",s:"AuthorityView demo controls"},{id:"rollback",tags:["rollback","drill","disaster","recovery","reset","clean"],q:"What is the rollback ledger used for?",a:"A super-admin disaster-recovery drill: pick a UTC boundary and every newer record is deleted. It is deliberate, needs the admin role, and because it happens under a watchful on-chain root it can't be used to secretly clean evidence.",s:"AuthorityView rollback modal"},{id:"roles",tags:["roles","access","officer","super-admin","approve","authorisation","authz"],q:"Who can do what?",a:"Anyone can verify and read analytics. **Approved officers** (Google SSO + admin-assigned post/institution) can sign, broadcast, and screen documents. **Supervisors/super-admins** adjudicate screening verdicts, manage the watchlist, assign roles, and run ledger sync/rollback. Titles are granted, never self-claimed.",s:"main.py access model + MHA_SCREENING.md"},{id:"fake",tags:["fake","fake","forgery","fraud","report","scam","proven_fake"],q:"What happens when a file comes back fake?",a:"The card shows `PROVEN_FAKE` and offers **Report this fake** — logging that exact copy + hash as a community fraud report so the network learns it circulated. A tampered file keeps its signed history but is marked non-authentic.",s:"VerdictCard.tsx"},{id:"compare",tags:["compare","copy","versions","match","zip","batch"],q:"Can I compare two copies of a file?",a:"Yes — the **Compare a copy** control takes a second SHA-256 (or a second file) and instantly says match or mismatch. Great for spotting a subtly altered 'copy' of a real document. Zip batches verify each member individually.",s:"VerdictCard compare control"},{id:"tech",tags:["tech","stack","fastapi","react","vite","sqlite","vercel","provider"],q:"What is the tech stack?",a:"**Backend**: FastAPI + SQLAlchemy/SQLite + cryptography (ECDSA/KMS-style signer), Sightengine/web3 for anchoring, bundled in two files (`app/main.py`, `app/screening.py`). **Frontend**: React + TypeScript + Vite, built into a single self-contained `app/static/index.html`. Deployable on Vercel via `api/index.py`.",s:"requirements.txt + package.json"},{id:"run",tags:["run","start","install","setup","local","port","8000"],q:"How do I run it locally?",a:"Double-click **START.bat** (Windows): it installs Python + npm deps on first run, rebuilds the frontend, starts `uvicorn` on port 8000 and opens the browser. Manual: `python -m pip install -r requirements.txt`, `npm install && npm run build` in `frontend/`, then `uvicorn main:app --port 8000` from `app/`.",s:"START.bat + HOW_TO_HOST.md"},{id:"explain",tags:["explain","breakdown","verdict","layman","details","why","reason"],q:"Does the app explain its results?",a:"*nocap doesn't have a standalone 'explain mode'.* Instead, whenever you run a verification or document screening, the app provides a detailed breakdown of its verdict — `AUTHENTIC`, `PROVEN_FAKE`, `REVOKED`, or `UNSIGNED`. That breakdown covers checking the file's SHA-256 hash, inspecting metadata self-tags and pixel noise for AI generation, testing the cryptographic signature, and — for documents — verifying identity rules like Verhoeff check digits or MRZ lines. Screening results explain whether a document scored CLEAR, REVIEW, or FLAGGED and why.",s:"VerifyPanel + screening.py"}],np=["What does nocap do?","How does verify work?","What is the kill switch?","How do we demo the fraud dashboard?","What is the tech stack?","How do I run it locally?"],go=g=>g.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();function rp(g,x=2){const o=go(g);if(!o)return[];const _=o.split(" ").filter(Boolean);return tp.map(l=>{const d=go(l.tags.join(" ")),c=go(l.q);let v=0;for(const E of _)d.includes(E)?v+=3:c.includes(E)&&(v+=1),(d.startsWith(E)||c.includes(E))&&(v+=1);return _.every(E=>d.includes(E)||c.includes(E))&&(v+=4),{e:l,score:v}}).filter(l=>l.score>0).sort((l,d)=>d.score-l.score).slice(0,x).map(l=>l.e)}function Dc(g){const x=rp(g,2);return x.length?x.map(o=>sp(o.a+(o.s?`
